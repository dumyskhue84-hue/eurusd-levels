name: Daily EURUSD levels (00:05 UTC)
on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC daily
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail fast if the CF token can't deploy (Pages:Edit missing/expired)
      - name: Preflight Cloudflare token (Pages:Edit)
        run: |
          code=$(curl -s -o cf_preflight.json -w '%{http_code}' -G \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/eurusd-levels/upload-token" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "upload-token HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot deploy (HTTP $code). It must be active with Account > Cloudflare Pages > Edit. Body:"
            cat cf_preflight.json
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            data/raw
            data/cache
          key: ${{ runner.os }}-deps-histdata-${{ hashFiles('requirements.txt', 'pwa-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-histdata-
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas pyarrow requests matplotlib
      # HistData history (dynamic current/prior month) -> 5m parquet
      - name: Fetch HistData and rebuild 5m parquet
        run: python scripts/pipeline.py
        env: { PYTHONIOENCODING: 'utf-8' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Dukascopy daily tail (same FX 5m type, fills HistData publish lag)
      - name: Append Dukascopy daily tail
        run: python scripts/daily_append.py
        env: { PYTHONIOENCODING: 'utf-8' }
      - name: Build adaptive levels
        run: python scripts/daily_adaptive.py
      - name: Generate levels.json (staleness warning if >1d)
        run: python scripts/generate_levels_json.py
      - name: Generate bias.json (economic calendar)
        run: python scripts/daily_bias.py
        env: { PYTHONIOENCODING: 'utf-8' }
      - run: cp public/levels.json public/bias.json pwa-app/public/
      - uses: actions/upload-artifact@v4
        with:
          name: levels
          path: |
            pwa-app/public/levels.json
            pwa-app/public/bias.json
      - run: npm ci --prefix pwa-app && npm run build --prefix pwa-app
        env: { CI: 'true' }
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy pwa-app/dist --project-name=eurusd-levels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live endpoints
        run: |
          echo "--- manifest ---"
          curl -s https://eurusd-levels.pages.dev/manifest.webmanifest | head -c 200
          echo
          echo "--- levels.json ---"
          curl -s https://eurusd-levels.pages.dev/levels.json | head -c 400
          echo
          echo "--- bias.json ---"
          curl -s https://eurusd-levels.pages.dev/bias.json | head -c 400
          echo
